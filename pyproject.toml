[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eigenchip"
version = "0.5.0"
description = "Reducing music to a few chip voices: a research toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Sandner" }]
keywords = ["music", "midi", "audio", "transcription", "chiptune", "arrangement", "music information retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=1.20"]

[project.urls]
Repository = "https://github.com/eigensoundlab/eigenchip"

[project.scripts]
eigenchip = "eigenchip.cli:main"

[tool.setuptools.packages.find]
include = ["eigenchip*"]
